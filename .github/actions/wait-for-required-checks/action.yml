name: Wait for required checks
description: >-
  Poll the GitHub Checks API for a list of named check-run contexts on the
  current PR head SHA. Exit success when every named check has resolved to
  success / skipped / neutral, or has not registered within a grace window
  (treated as not-applicable, i.e. the source workflow's path filter excluded
  this PR). Exit failure if any named check completes with failure / cancelled
  / timed_out / action_required, or if the overall wait exceeds the maximum.

# Vendored into this repo (rather than consumed via `uses: <org>/<repo>@sha`)
# so the gate has no cross-repo dependency and needs no Actions allowlist
# entry. Logic is implemented in Node (index.cjs), see README.md.

inputs:
  required-checks:
    description: >-
      Newline-separated list of check-run names (status contexts) to wait for.
      Match the strings exactly as they appear in the branch ruleset's
      required_status_checks.
    required: true
  grace-seconds:
    description: >-
      Seconds of quiet (no start or completion of ANY listed check) to wait
      for a check to first appear on the head SHA before treating it as
      not-applicable. The window re-arms on every activity, so a check that
      only registers after another one completes (a dynamic-matrix job) is
      still waited for; the same window lets a cancelled run be superseded by
      its replacement before the cancellation counts as a failure.
    required: false
    default: "90"
  poll-seconds:
    description: Seconds between polls of the Checks API.
    required: false
    default: "15"
  max-wait-seconds:
    description: Hard upper bound on total wait time before giving up.
    required: false
    default: "2400"
  head-sha:
    description: >-
      Commit SHA to read check-runs for. Defaults to the PR head SHA from the
      triggering event; this action only supports pull_request /
      pull_request_target events.
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  event-time:
    description: >-
      ISO 8601 time of the event that triggered the gate. A completed check
      run that started before it comes from an earlier event on the same SHA
      (the gate re-runs on, e.g., ready_for_review), so its result only counts
      after the grace window, giving the re-run time to register. Defaults to
      the PR's updated_at from the triggering event; empty turns this off.
    required: false
    default: ${{ github.event.pull_request.updated_at }}
  github-token:
    description: Token used to read check-runs. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: index.cjs
