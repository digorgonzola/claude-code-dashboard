name: CI

# Runs on EVERY PR, drafts included, with no paths-ignore. The repo is small,
# the job is fast, and an always-posting check keeps the Required Checks gate
# simple (the gate never has to treat an absent check as not-applicable for
# this workflow).
#
# Do NOT draft-gate or otherwise skip this job: "Syntax Check" is listed in
# required-checks.yml, and the gate counts a `skipped` run as a pass (see
# "Listed checks must run on draft PRs" in the gate action's README).
# Marking a PR ready creates no new commit, so the run from the draft push
# already decides the gate; no ready_for_review trigger is needed.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned pnpm version from the packageManager field in
      # package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # cache: pnpm stores the pnpm store in the GitHub Actions cache, keyed
      # on pnpm-lock.yaml.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm

      # --frozen-lockfile fails if the lockfile does not match package.json.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Zero-dep parse pass over every first-party JS file (scripts/check.mjs).
      - name: Syntax check
        run: pnpm run check

      # Unit tests (*.test.cjs under .github/). `node --test` runs each file
      # as a child process and fails on a non-zero exit, so the plain-node
      # test file copied from the central action needs no runner. The
      # pattern names .github/ because node's ** does not enter
      # dot-directories, and it is quoted so node, not sh, expands it.
      - name: Unit tests
        run: pnpm test
