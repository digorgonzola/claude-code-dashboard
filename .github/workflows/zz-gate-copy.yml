name: Gate Copy (throwaway test, do not merge)

# Single-context aggregation gate for the branch ruleset.
#
# This job ALWAYS runs on every PR and polls the Checks API via the vendored
# $/.github/actions/wait-for-required-checks action. It passes when each named
# check has succeeded, was skipped, or never registered within the grace
# window (a source workflow's paths filter excluded this PR). It fails if any
# named check failed. Mark THIS job's context ("Required Checks") as required
# in the ruleset, not the underlying checks. One stable required context lets
# Renovate automerge on green while new workflows can be added to the list
# below without touching the ruleset.
#
# Trigger is pull_request_target so both this workflow AND the vendored action
# load from the base branch (main): a PR cannot disable, rename, or neuter the
# gate by editing them in its own diff. `$/` resolves the action at the
# running workflow's commit (the BASE branch here) with no checkout, and the
# action runs no PR code. It only reads the Checks API for the PR head SHA
# taken from the event payload. Do NOT add a checkout of the PR head ref and
# do NOT add any `run:` of PR-supplied code.
#
# Draft handling: ci.yml skips its check job for draft PRs, so "Syntax Check"
# posts as `skipped`. When every run of a check is skipped, the gate action
# counts the skip as a pass (it must, for genuine not-applicable skips).
# Marking a PR ready for review does NOT create a new commit, so a stale green
# context would survive on the head SHA into the ready_for_review-to-merge
# window. So while the PR is a draft this gate FAILS outright. ready_for_review
# is in the trigger list, so the gate re-runs the moment the PR leaves draft.
# That run sees the draft's `skipped` run on the same SHA, which started before
# the PR's updated_at (passed as the action's event-time). The action holds it
# through the grace window, so the gate cannot pass on it before ci.yml's real
# run registers and supersedes it. zizmor.yml runs on drafts and does not
# re-run on ready_for_review, so its draft-time result for the same SHA counts
# once that grace window ends.
#
# The draft flag and updated_at come from the LIVE pull request, not the event
# payload. A push to a draft followed by "ready for review" seconds later
# queues a synchronize run (payload draft: true) and a ready_for_review run
# (payload draft: false) for one SHA, in no fixed order, and the concurrency
# group below keeps only the one queued last. Reading the live PR makes that
# survivor decide on the PR as it is now, whichever event started it.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# github.ref is the BASE ref under pull_request_target, so key concurrency on
# the PR number. Otherwise every PR shares one group and they cancel each
# other. The head SHA is in the group too so a run for a stale SHA can never
# cancel the run for the current SHA; same-SHA duplicates still dedupe.
# Keep one group per SHA (no draft flag in it): the branch ruleset reads only
# the newest "Required Checks" run on the SHA, and the run that survives the
# group is always the newest, so no stale draft-time failure can decide.
concurrency:
  group: gate-copy-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  contents: read # fetch the `$/` gate action from this repo
  checks: read # read check-runs on the head SHA
  pull-requests: read # read the live draft state and updated_at of the PR

jobs:
  required-checks:
    name: Gate Copy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # While draft, ci.yml skips the real checks. Fail fast rather than let a
      # `skipped` check be laundered into a green gate. Marking the PR ready
      # for review re-triggers this workflow (ready_for_review) and the steps
      # below then wait on the real checks. A failed step stops the job, so
      # the wait below never runs for a draft. The state is read live (see
      # header); anything but an exact draft flag and timestamp fails closed.
      - name: Fail while draft (real checks are skipped for drafts)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          read -r draft updated_at < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '"\(.draft) \(.updated_at)"')
          if [[ "$draft" == "true" ]]; then
            echo "::error title=Draft PR::Checks are skipped for draft PRs, so the Required Checks gate does not pass while this PR is a draft. Mark the PR 'Ready for review' to run the checks and satisfy the gate."
            exit 1
          fi
          if [[ "$draft" != "false" || ! "$updated_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error title=Bad PR state::Could not read the draft state of PR ${PR_NUMBER}."
            exit 1
          fi
          echo "updated-at=${updated_at}" >> "$GITHUB_OUTPUT"

      # `$/` loads the action from the commit running this workflow, which
      # under pull_request_target is the BASE branch (trusted). No checkout,
      # so no PR code touches the runner.
      - name: Wait for required checks
        uses: $/.github/actions/wait-for-required-checks
        with:
          # Exact check-run names (status contexts). Add new gating checks
          # here as workflows grow.
          required-checks: |
            Syntax Check
            Audit workflows
          # Absent-after-grace means not-applicable. Matches the action's
          # 90s default; absorbs GitHub's queue latency before ci.yml and
          # zizmor.yml register their check-runs on the head SHA. zizmor.yml
          # is path-filtered to .github/**, so on most PRs it never registers.
          grace-seconds: "90"
          event-time: ${{ steps.pr.outputs.updated-at }}
