name: Required Checks

# Single-context aggregation gate for the branch ruleset.
#
# This job ALWAYS runs on every PR and polls the Checks API via the vendored
# $/.github/actions/wait-for-required-checks action. It passes when each named
# check has succeeded, was skipped, or never registered within the grace
# window (a source workflow's paths filter excluded this PR). It fails if any
# named check failed. Mark THIS job's context ("Required Checks") as required
# in the ruleset, not the underlying checks. One stable required context lets
# Renovate automerge on green while new workflows can be added to the list
# below without touching the ruleset.
#
# Trigger is pull_request_target so both this workflow AND the vendored action
# load from the base branch (main): a PR cannot disable, rename, or neuter the
# gate by editing them in its own diff. `$/` resolves the action at the
# running workflow's commit (the BASE branch here) with no checkout, and the
# action runs no PR code. It only reads the Checks API for the PR head SHA
# taken from the event payload. Do NOT add a checkout of the PR head ref and
# do NOT add any `run:` of PR-supplied code.
#
# Drafts: the gate runs on draft PRs like any other, and every check listed
# below must too. A draft-gated source job posts `skipped`, which the action
# counts as a pass, and marking a PR ready creates no new commit to re-run
# anything (see "Listed checks must run on draft PRs" in the action README).
# Because the listed checks run on drafts, the result for the head SHA is
# already real when the PR leaves draft, so ready_for_review is not a trigger.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] base-branch gate; action loaded via $/ from base commit, no checkout, no PR code executed (see header)
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# github.ref is the BASE ref under pull_request_target, so key concurrency on
# the PR number. Otherwise every PR shares one group and they cancel each
# other. The head SHA is in the group too so a run for a stale SHA can never
# cancel the run for the current SHA; same-SHA duplicates still dedupe.
concurrency:
  group: required-checks-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  contents: read # fetch the `$/` gate action from this repo
  checks: read # read check-runs on the head SHA

jobs:
  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # `$/` loads the action from the commit running this workflow, which
      # under pull_request_target is the BASE branch (trusted). No checkout,
      # so no PR code touches the runner.
      - name: Wait for required checks
        uses: $/.github/actions/wait-for-required-checks
        with:
          # Exact check-run names (status contexts). Add new gating checks
          # here as workflows grow.
          required-checks: |
            Syntax Check
            Audit workflows
          # Absent-after-grace means not-applicable. Matches the action's
          # 90s default; absorbs GitHub's queue latency before ci.yml and
          # zizmor.yml register their check-runs on the head SHA. zizmor.yml
          # is path-filtered to .github/**, so on most PRs it never registers.
          grace-seconds: "90"
